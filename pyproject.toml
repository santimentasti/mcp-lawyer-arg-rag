[project]
name = "lexar"
version = "0.1.0"
description = "MCP server de derecho argentino (Civil y Comercial) para ChatGPT y Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lexar-server = "lexar.server:main"
lexar-ingest = "lexar.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
